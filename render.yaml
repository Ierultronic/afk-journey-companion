services:
  - type: web
    name: afk-journey-companion
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
    healthCheckPath: /api/health
    autoDeploy: true
